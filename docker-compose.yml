# 메모리 최적화를 위한 docker-compose 설정
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: traffic
      # 한글 지원 설정
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      LC_CTYPE: ko_KR.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./django-react-backend-api-ifro/sqldata-backup/20250727:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --skip-ssl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./django-react-backend-api-ifro
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=traffic
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1234
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DJANGO_SECRET_KEY=unsafe-dev-secret-key-for-local-development
      - JWT_SECRET_KEY=a-different-unsafe-secret-key-for-jwt
      - DJANGO_ENCRYPTION_PASSWORD=forBus_password
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - GEMINI_API_KEY=AIzaSyAwA17afiK3RW95Z9hBcWpDOOVU_PELtfw
      - CHATBOT_URL=http://chatbot:8008
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django-react-backend-api-ifro:/app
    command: >
      sh -c "cd /app/src &&
             echo 'Waiting for MySQL to be ready...' &&
             until mysql -h db -u root -p$$MYSQL_PASSWORD --skip-ssl -e 'SELECT 1;' > /dev/null 2>&1; do
               sleep 1;
             done &&
             echo 'MySQL is ready.' &&
             echo 'Running migrations...' &&
             echo 'Checking Django system tables...' &&
             python manage.py migrate --run-syncdb --verbosity=0 || echo 'Initial migration attempt completed' &&
             python manage.py migrate traffic --verbosity=0 || echo 'Traffic migration attempt completed' &&
             echo 'All migrations completed. Starting services...' &&
             echo '[ENCRYPT] 🔄 encrypt_transfer.py 시작됨...' &&
             python ../encrypt_transfer.py &
             ENCRYPT_PID=$$! &&
             echo 'Starting Django server...' &&
             python manage.py runserver 0.0.0.0:8000 &
             wait $$ENCRYPT_PID &&
             echo '[ENCRYPT] ✅ encrypt_transfer.py 완료됨.' &&
             wait"

  frontend:
    build:
      context: ./django-react-frontend-ifro
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./django-react-frontend-ifro:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - REACT_APP_API_URL=http://localhost:8000
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4096M
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    command: >
      sh -c "
        echo 'Starting Ollama server...' &&
        /bin/ollama serve &
        echo 'Waiting for Ollama server to be ready...' &&
        until python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:11434/api/tags\")' 2>/dev/null; do
          sleep 1;
        done &&
        echo 'Ollama server is ready. Checking for qwen2:1.5b-instruct-q4_K_M model...' &&
        if ollama list | grep -q 'qwen2:1.5b-instruct-q4_K_M'; then
          echo 'Model qwen2:1.5b-instruct-q4_K_M is already installed.';
        else
          echo 'Downloading qwen2:1.5b-instruct-q4_K_M model...' &&
          ollama pull qwen2:1.5b-instruct-q4_K_M &&
          echo 'Model download completed.';
        fi &&
        wait
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434/api/tags')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


  chatbot:
    build: ./ollama-llm-chatbot-api-ifro
    container_name: ifro-chatbot
    ports:
      - "8008:8000"
    environment:
      # 메모리 최적화 환경 변수
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      - LLM_TIMEOUT=30
      - RERANK_TIMEOUT=10
      - SEARCH_TIMEOUT=5
      
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    volumes:
      - ./ollama-llm-chatbot-api-ifro:/app
      - ./ollama-llm-chatbot-api-ifro/data:/app/data
      - ./ollama-llm-chatbot-api-ifro/models:/app/models
      - ./ollama-llm-chatbot-api-ifro/vector_store:/app/vector_store
      - ./ollama-llm-chatbot-api-ifro/logs:/app/logs
    # depends_on:
    #   ollama:
    #     condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  chatbot_data:
  chatbot_vector_store:
  chatbot_logs:
  chatbot_models:
  sbert_cache:
  ollama_data:

networks:
  default:
    driver: bridge
