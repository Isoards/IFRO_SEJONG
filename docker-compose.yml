# 메모리 최적화를 위한 docker-compose 설정
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: traffic
      # 한글 지원 설정
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      LC_CTYPE: ko_KR.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./django-react-backend-api-ifro/sqldata-backup/20250727:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --skip-ssl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./django-react-backend-api-ifro
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=traffic
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1234
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DJANGO_SECRET_KEY=unsafe-dev-secret-key-for-local-development
      - JWT_SECRET_KEY=a-different-unsafe-secret-key-for-jwt
      - DJANGO_ENCRYPTION_PASSWORD=forBus_password
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - GEMINI_API_KEY=AIzaSyAwA17afiK3RW95Z9hBcWpDOOVU_PELtfw
      - CHATBOT_URL=http://chatbot:8008
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django-react-backend-api-ifro:/app
    command: >
      sh -c "cd /app/src &&
             echo 'Waiting for MySQL to be ready...' &&
             until mysql -h db -u root -p$$MYSQL_PASSWORD --skip-ssl -e 'SELECT 1;' > /dev/null 2>&1; do
               sleep 1;
             done &&
             echo 'MySQL is ready.' &&
             echo 'Running migrations...' &&
             echo 'Checking Django system tables...' &&
             python manage.py migrate --run-syncdb --verbosity=0 || echo 'Initial migration attempt completed' &&
             python manage.py migrate traffic --verbosity=0 || echo 'Traffic migration attempt completed' &&
             echo 'All migrations completed. Starting services...' &&
             echo '[ENCRYPT] 🔄 encrypt_transfer.py 시작됨...' &&
             python ../encrypt_transfer.py &
             ENCRYPT_PID=$$! &&
             echo 'Starting Django server...' &&
             python manage.py runserver 0.0.0.0:8000 &
             wait $$ENCRYPT_PID &&
             echo '[ENCRYPT] ✅ encrypt_transfer.py 완료됨.' &&
             wait"

  frontend:
    build:
      context: ./django-react-frontend-ifro
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./django-react-frontend-ifro:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - REACT_APP_API_URL=http://localhost:8000
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4096M
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull-qwen
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-lc", "echo 'Waiting for Ollama...' && until curl -fsS http://ollama:11434/api/tags >/dev/null; do sleep 1; done && echo 'Pulling model: qwen2:1.5b-instruct-q4_K_M' && ollama pull qwen2:1.5b-instruct-q4_K_M"]

  chatbot:
    build: ./ollama-LLM-ChatBot
    container_name: ifro-chatbot
    ports:
      - "8008:8000"
    # CPU 사용 (GPU 미사용). GPU 사용 시 runtime/env 추가
    environment:
      # 메모리 최적화 환경 변수
      - MAX_MODEL_MEMORY_GB=8.0
      - MEMORY_WARNING_THRESHOLD=75.0
      - MEMORY_CRITICAL_THRESHOLD=85.0
      - PDF_MAX_MEMORY_GB=2.0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # 모델 설정 (Ollama + Qwen 1.5B, q4_K_M)
      - MODEL_TYPE=ollama
      - MODEL_NAME=qwen2:1.5b-instruct-q4_K_M
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=jhgan/ko-sroberta-multitask
      # 청크 초기화 설정
      - RESET_CHUNKS_ON_START=false
      - AUTO_UPLOAD_PDFS=true
      
      # 세종대학교 교통정보 시스템 설정
      - COMPANY_NAME=세종대학교 교통정보 시스템
      - COMPANY_DESCRIPTION=세종대학교 교통정보 분석 및 관리 시스템
      - COMPANY_TAGLINE=지능형 교통정보 분석 및 예측 시스템
      - COMPANY_ROLE=교통정보 분석, 교통량 예측, 교통사고 분석, AI 답변 생성
      - SYSTEM_TYPE=세종대학교 교통정보 시스템
      - COMPANY_LOCATION=서울특별시 광진구 능동로 209
      - COMPANY_WEBSITE=https://www.sejong.ac.kr
      - COMPANY_EMAIL=traffic@sejong.ac.kr
      - API_TITLE=세종대학교 교통정보 시스템 API
      - API_DESCRIPTION=세종대학교 교통정보 분석 및 관리 시스템 API
      - COMPANY_GREETING=안녕하세요! 세종대학교 교통정보 시스템에 오신 것을 환영합니다! 🚗
      - DEFAULT_GREETING=안녕하세요! 세종대학교 교통정보 시스템입니다. 교통정보에 대해 무엇이든 물어보세요! 🚦
      
      # Hugging Face 캐시 설정
      - HF_HOME=/app/models
      - TORCH_HOME=/app/models
    volumes:
      - ./ollama-LLM-ChatBot/data:/app/data
      - ./ollama-LLM-ChatBot/models:/app/models
      - ./ollama-LLM-ChatBot/logs:/app/logs
      - ./ollama-LLM-ChatBot/vector_store:/app/vector_store
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 16G  # GPU 사용 시 메모리 증가
          cpus: '6.0'  # CPU 제한 설정
        reservations:
          memory: 12G   # 최소 메모리 보장
          cpus: '3.0'  # 최소 CPU 보장
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
  chatbot_data:
  chatbot_vector_store:
  chatbot_logs:
  chatbot_models:
  sbert_cache:
  ollama_data:

networks:
  default:
    driver: bridge
