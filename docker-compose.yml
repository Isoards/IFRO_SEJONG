version: '3.8'

# IFRO 시스템 Docker Compose 설정
# 사용법:
#   docker-compose up -d                    # 전체 서비스 (메모리 8GB+ 필요)
#   docker-compose up -d db backend frontend # 경량 모드 (AI 서비스 제외)
#   docker-compose up -d ollama chatbot      # AI 서비스만 (CPU)
#   docker-compose -f docker-compose.gpu.yml up -d # GPU 지원 AI 서비스

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: traffic
      # 한글 지원 설정
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      LC_CTYPE: ko_KR.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./django-react-backend-api-ifro/sqldata-backup/20250727:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --skip-ssl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./django-react-backend-api-ifro
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=traffic
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1234
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DJANGO_SECRET_KEY=unsafe-dev-secret-key-for-local-development
      - JWT_SECRET_KEY=a-different-unsafe-secret-key-for-jwt
      - DJANGO_ENCRYPTION_PASSWORD=forBus_password
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - GEMINI_API_KEY=AIzaSyApCGrauxpGv2P2xNDKKvLwYRxSvcdrN6c
      - CHATBOT_URL=http://chatbot:8000
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      db:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    volumes:
      - ./django-react-backend-api-ifro:/app
    command: >
      sh -c "cd /app/src &&
             echo 'Waiting for MySQL to be ready...' &&
             until mysql -h db -u root -p$$MYSQL_PASSWORD --skip-ssl -e 'SELECT 1;' > /dev/null 2>&1; do
               sleep 1;
             done &&
             echo 'MySQL is ready.' &&
             echo 'Running migrations...' &&
             echo 'Checking Django system tables...' &&
             python manage.py migrate --run-syncdb --verbosity=0 || echo 'Initial migration attempt completed' &&
             python manage.py migrate traffic --verbosity=0 || echo 'Traffic migration attempt completed' &&
             echo 'All migrations completed. Starting services...' &&
             echo '[ENCRYPT] 🔄 encrypt_transfer.py 시작됨...' &&
             python ../encrypt_transfer.py &
             ENCRYPT_PID=$$! &&
             echo 'Starting Django server...' &&
             python manage.py runserver 0.0.0.0:8000 &
             wait $$ENCRYPT_PID &&
             echo '[ENCRYPT] ✅ encrypt_transfer.py 완료됨.' &&
             wait"

  frontend:
    build:
      context: ./django-react-frontend-ifro
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./django-react-frontend-ifro:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - REACT_APP_API_URL=http://localhost:8000
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4096M
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
    # GPU 설정 (runtime 방식)
    runtime: nvidia
    # 기본 ollama serve 명령어 사용
    # 모델은 챗봇 서버 시작 시 자동으로 다운로드됨
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  chatbot:
    build: ./ollama-chatbot-api-ifro
    container_name: ifro-chatbot
    ports:
      - "8010:8000"
    environment:
      # 메모리 최적화 환경 변수
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      - LLM_TIMEOUT=60
      - RERANK_TIMEOUT=15
      - SEARCH_TIMEOUT=10
      - OLLAMA_HOST=ollama
      # 모델 자동 다운로드 설정
      - AUTO_PULL_MODEL=true
      - MODEL_PULL_TIMEOUT=600
      - MODEL_PULL_RETRIES=3
      
      # 한글 지원 설정
      - LANG=ko_KR.UTF-8
      - LC_ALL=ko_KR.UTF-8
      - LC_CTYPE=ko_KR.UTF-8
      # 웹 검색 설정
      - WEB_SEARCH_ENABLED=true
      - WEB_SEARCH_ENGINE=duckduckgo
      - WEB_SEARCH_API_KEY=
    volumes:
      - ./ollama-chatbot-api-ifro:/app
      - ./ollama-chatbot-api-ifro/data:/app/data
      - ./ollama-chatbot-api-ifro/models:/app/models
      - ./ollama-chatbot-api-ifro/vector_store:/app/vector_store
      - ./ollama-chatbot-api-ifro/logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  mysql_data:
  chatbot_data:
  chatbot_vector_store:
  chatbot_logs:
  chatbot_models:
  sbert_cache:
  ollama_data:

networks:
  default:
    driver: bridge
